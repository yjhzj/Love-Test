<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>你是哪一种恋人 · 依恋类型深度测评</title>
<style>
:root{
  --pink-50:#FFF7FA; --pink-100:#FFE9F1; --pink-200:#FFD3E3; --pink-300:#FFB3CE;
  --pink-400:#FF8AB5; --pink-500:#F9629B; --pink-600:#E23F7E;
  --ink:#2A1F2D; --ink-2:#5B4A5E; --muted:#9C8B9F;
  --line:rgba(42,31,45,.08);
  --shadow:0 24px 60px -22px rgba(226,63,126,.30);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);color:var(--ink);
  background:
    radial-gradient(1100px 560px at 50% -12%, #FFE0EE 0%, transparent 62%),
    radial-gradient(900px 520px at 112% 108%, #FFF0F7 0%, transparent 58%),
    linear-gradient(180deg,#FFF8FB 0%,#FFFFFF 46%,#FFF4F9 100%);
  min-height:100vh;min-height:100dvh;overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(249,98,155,.14) 1px, transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(circle at 50% 28%, #000 0%, transparent 74%);
  mask-image:radial-gradient(circle at 50% 28%, #000 0%, transparent 74%);
}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{
  position:relative;z-index:2;width:100%;max-width:540px;margin:0 auto;
  height:100vh;height:100dvh;overflow:hidden;
}
@media(min-width:640px){
  #app{box-shadow:0 0 90px -30px rgba(226,63,126,.22);border-radius:0}
}
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:38px 24px 56px;
  opacity:0;transform:translateY(26px) scale(.985);pointer-events:none;
  transition:opacity .55s ease, transform .6s cubic-bezier(.22,1,.36,1);
}
.screen.is-active{opacity:1;transform:none;pointer-events:auto}
.screen::-webkit-scrollbar{display:none}

/* ---------- 通用 ---------- */
.brand{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.18em;color:var(--muted);font-weight:600}
.brand .dot{width:6px;height:6px;border-radius:50%;background:var(--pink-500);box-shadow:0 0 0 4px rgba(249,98,155,.14);animation:dotPulse 2.2s infinite}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 3px rgba(249,98,155,.16)}50%{box-shadow:0 0 0 8px rgba(249,98,155,.04)}}
.grad{background:linear-gradient(115deg,#FFA6C8 0%,#F9629B 46%,#E23F7E 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:0;cursor:pointer;font-family:var(--font);font-weight:700;font-size:16px;
  border-radius:999px;padding:17px 34px;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .3s;
}
.btn-primary{
  color:#fff;background:linear-gradient(135deg,#FF8AB5,#F9629B 55%,#E23F7E);
  box-shadow:0 18px 40px -14px rgba(226,63,126,.62), inset 0 1px 0 rgba(255,255,255,.35);
  width:100%;max-width:320px;
}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{
  color:var(--pink-600);background:#fff;border:1px solid var(--pink-200);
  box-shadow:0 10px 26px -16px rgba(226,63,126,.5);
}
.tip{font-size:12px;color:var(--muted);letter-spacing:.04em;text-align:center}
.step-tag{font-size:11px;letter-spacing:.2em;color:var(--pink-500);font-weight:700;margin:0 0 14px}
.h2{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px;line-height:1.3}
.sub{font-size:13.5px;line-height:1.85;color:var(--ink-2);margin:0 0 26px}

/* ---------- 封面 ---------- */
#sIntro .wrap{padding-top:16px}
#sIntro .brand{margin-bottom:44px}
.hero-title{font-size:clamp(38px,11.4vw,50px);line-height:1.14;font-weight:800;letter-spacing:-.035em;margin:0 0 20px}
.hero-title em{font-style:normal;position:relative;display:inline-block}
.hero-title em::after{
  content:'';position:absolute;left:-2px;right:-2px;bottom:6px;height:12px;border-radius:6px;
  background:linear-gradient(90deg,rgba(255,179,206,.55),rgba(255,138,181,.18));z-index:-1;
}
.hero-sub{font-size:14px;line-height:2;color:var(--ink-2);margin:0 0 34px}
.feature-row{display:flex;gap:10px;margin-bottom:38px}
.feat{
  flex:1;background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:18px;
  padding:16px 10px;text-align:center;backdrop-filter:blur(10px);
  animation:featIn .7s cubic-bezier(.22,1,.36,1) both;
}
.feat:nth-child(1){animation-delay:.08s}
.feat:nth-child(2){animation-delay:.16s}
.feat:nth-child(3){animation-delay:.24s}
@keyframes featIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.feat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--pink-600)}
.feat span{display:block;font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.06em}
.center{text-align:center}
#sIntro .btn-primary{margin:0 auto;display:flex}
#sIntro .tip{margin-top:16px}

/* ---------- 性别 ---------- */
.gender-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
.g-card{
  position:relative;overflow:hidden;cursor:pointer;
  background:#fff;border:1.5px solid var(--line);border-radius:24px;
  padding:26px 12px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;
  font-family:var(--font);transition:all .35s cubic-bezier(.22,1,.36,1);
  box-shadow:0 10px 30px -22px rgba(226,63,126,.6);
}
.g-card::before{
  content:'';position:absolute;inset:0;opacity:0;transition:.35s;
  background:radial-gradient(120px 90px at 50% 0%, rgba(255,179,206,.5), transparent 70%);
}
.g-card:hover,.g-card:active{transform:translateY(-5px);border-color:var(--pink-300);box-shadow:0 24px 44px -20px rgba(226,63,126,.55)}
.g-card:hover::before{opacity:1}
.g-icon{width:64px;height:64px;position:relative;z-index:1}
.g-name{font-size:17px;font-weight:800;letter-spacing:.02em;position:relative;z-index:1}
.g-desc{font-size:11px;color:var(--muted);letter-spacing:.02em;position:relative;z-index:1}
.g-card .ring{
  position:absolute;width:120px;height:120px;border-radius:50%;border:1px dashed var(--pink-200);
  top:-46px;right:-46px;opacity:.7;
}

/* ---------- 答题 ---------- */
.quiz-shell{padding-top:8px;display:flex;flex-direction:column;min-height:calc(100dvh - 94px)}
.quiz-head{margin-bottom:26px}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.qidx{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.qidx b{font-size:17px;color:var(--ink);font-weight:800;letter-spacing:-.01em}
.qidx i{font-style:normal}
.pct{font-size:12px;font-weight:700;color:var(--pink-500);letter-spacing:.05em}
.bar{height:5px;border-radius:99px;background:var(--pink-100);overflow:hidden;position:relative}
.bar-fill{
  height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#FFC9DD,#FF8AB5 50%,#F9629B);
  box-shadow:0 0 14px rgba(249,98,155,.6);
  transition:width .55s cubic-bezier(.22,1,.36,1);
}
.q-card{
  background:rgba(255,255,255,.9);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:28px;padding:28px 22px 22px;
  box-shadow:var(--shadow);flex:1;display:flex;flex-direction:column;
}
.q-card.in{animation:cardIn .48s cubic-bezier(.22,1,.36,1) both}
.q-card.out{animation:cardOut .22s ease forwards}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:translateY(-14px) scale(.98)}}
.q-tag{
  display:inline-flex;align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:.14em;
  color:var(--pink-600);background:var(--pink-100);padding:5px 11px;border-radius:99px;margin-bottom:16px;
}
.q-text{font-size:19px;line-height:1.7;font-weight:700;letter-spacing:-.01em;margin:0 0 26px;min-height:96px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:11px;width:100%;
  padding:14px 15px;border-radius:16px;border:1.5px solid var(--line);background:#fff;
  font-family:var(--font);font-size:14.5px;color:var(--ink-2);text-align:left;cursor:pointer;
  transition:all .26s cubic-bezier(.22,1,.36,1);
}
.opt .k{
  width:25px;height:25px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:var(--pink-100);color:var(--pink-600);font-size:11px;font-weight:800;transition:.26s;
}
.opt:hover{transform:translateX(4px);border-color:var(--pink-300);background:var(--pink-50);box-shadow:0 12px 26px -16px rgba(249,98,155,.8)}
.opt.picked{background:linear-gradient(135deg,#FF8AB5,#F9629B);color:#fff;border-color:transparent;transform:scale(.975);box-shadow:0 16px 30px -14px rgba(226,63,126,.7)}
.opt.picked .k{background:rgba(255,255,255,.28);color:#fff}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:20px 0 0;letter-spacing:.03em;transition:.3s}
.hint.pop{animation:hintPop .5s ease}
@keyframes hintPop{0%{transform:scale(.9);opacity:0}100%{transform:none;opacity:1}}

/* ---------- 加载 ---------- */
#sLoading{display:flex;align-items:center;justify-content:center}
.loading-wrap{text-align:center;width:100%;padding-bottom:60px}
.pulse-heart{font-size:52px;color:var(--pink-500);animation:beat 1.1s infinite;filter:drop-shadow(0 8px 22px rgba(249,98,155,.5))}
@keyframes beat{0%,100%{transform:scale(1)}18%{transform:scale(1.22)}36%{transform:scale(1)}54%{transform:scale(1.14)}}
.loading-text{font-size:14px;color:var(--ink-2);margin:26px 0 22px;letter-spacing:.06em;font-weight:600;min-height:20px}
.load-bar{width:180px;height:4px;border-radius:99px;background:var(--pink-100);margin:0 auto;overflow:hidden}
.load-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#FFB3CE,#F9629B);transition:width .5s linear}

/* ---------- 结果 ---------- */
.res-hero{text-align:center;margin-bottom:30px}
.res-badge{
  display:inline-block;font-size:11px;letter-spacing:.22em;font-weight:700;color:var(--pink-600);
  background:var(--pink-100);padding:6px 16px;border-radius:99px;margin-bottom:22px;
}
.avatar-box{
  width:200px;height:200px;margin:0 auto 18px;position:relative;
  animation:floaty 4.5s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.avatar-box::after{
  content:'';position:absolute;inset:-18px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,rgba(255,179,206,.55),transparent 66%);filter:blur(12px);
}
.avatar-box svg{width:100%;height:100%;display:block}
.res-name{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:0 0 6px}
.res-en{font-size:11.5px;letter-spacing:.28em;color:var(--muted);font-weight:700;margin:0 0 14px}
.res-tagline{font-size:14.5px;color:var(--ink-2);line-height:1.85;margin:0;font-weight:500}

.res-card{
  background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:24px;
  padding:24px 22px;margin-bottom:14px;box-shadow:0 18px 44px -32px rgba(226,63,126,.8);
  opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .65s cubic-bezier(.22,1,.36,1);
}
.res-card.show{opacity:1;transform:none}
.res-card h3{
  font-size:15px;font-weight:800;margin:0 0 14px;letter-spacing:.01em;
  display:flex;align-items:center;gap:8px;
}
.res-card h3::before{content:'';width:4px;height:15px;border-radius:99px;background:linear-gradient(180deg,#FFB3CE,#F9629B)}
.res-card p{font-size:14px;line-height:2;color:var(--ink-2);margin:0 0 12px}
.res-card p:last-child{margin-bottom:0}
.res-card ul,.res-card ol{margin:0;padding-left:0;list-style:none}
.res-card li{
  font-size:13.5px;line-height:1.9;color:var(--ink-2);position:relative;
  padding-left:24px;margin-bottom:12px;
}
.res-card li:last-child{margin-bottom:0}
.res-card ul li::before{
  content:'♥';position:absolute;left:2px;top:0;color:var(--pink-400);font-size:11px;
}
.res-card ol{counter-reset:n}
.res-card ol li{counter-increment:n;padding-left:30px}
.res-card ol li::before{
  content:counter(n);position:absolute;left:0;top:4px;width:19px;height:19px;border-radius:50%;
  background:var(--pink-100);color:var(--pink-600);font-size:11px;font-weight:800;
  display:grid;place-items:center;
}
.res-card.accent{
  background:linear-gradient(160deg,#FFF7FA,#FFE9F1);
  border-color:var(--pink-200);
}

/* 分数条 */
.scores{margin-bottom:14px}
.score-row{margin-bottom:16px}
.score-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:12.5px;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
.score-head b{font-size:17px;color:var(--pink-600);font-weight:800}
.score-bar{height:8px;border-radius:99px;background:var(--pink-100);overflow:hidden}
.score-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#FFD3E3,#FF8AB5 55%,#F9629B);
  transition:width 1.2s cubic-bezier(.22,1,.36,1);
}
.score-note{font-size:12px;line-height:1.9;color:var(--muted);margin:16px 0 0}

.res-foot{text-align:center;padding:26px 0 10px}
.res-foot .btn{width:100%;max-width:300px;margin:0 auto 16px;display:flex}
.disclaimer{font-size:10.5px;color:#B9ABBD;line-height:1.8;margin:18px 0 0;letter-spacing:.02em}

.burst{position:fixed;pointer-events:none;color:#F9629B;z-index:999;transform:translate(-50%,-50%);animation:burstOut .85s cubic-bezier(.16,1,.3,1) forwards}
@keyframes burstOut{to{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.15) rotate(var(--rot));opacity:0}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div id="app">

  <!-- ============ 封面 ============ -->
  <section class="screen is-active" id="sIntro">
    <div class="wrap">
      <div class="brand"><span class="dot"></span>ATTACHMENT TYPE · 依恋类型测评</div>
      <h1 class="hero-title">你是<br><em class="grad">哪一种</em>恋人？</h1>
      <p class="hero-sub">基于成人依恋理论的四型模型，50 道深度题目，<br>看清你在爱里靠近与退后的方式。</p>
      <div class="feature-row">
        <div class="feat"><b>50</b><span>深度题目</span></div>
        <div class="feat"><b>2</b><span>核心维度</span></div>
        <div class="feat"><b>4</b><span>依恋类型</span></div>
      </div>
      <button class="btn btn-primary" id="btnStart">开始测评</button>
      <p class="tip">约 6 分钟 · 请凭第一直觉作答</p>
    </div>
  </section>

  <!-- ============ 性别 ============ -->
  <section class="screen" id="sGender">
    <div class="wrap">
      <p class="step-tag">STEP 01 / 02 · 基础信息</p>
      <h2 class="h2">先告诉我，你的性别</h2>
      <p class="sub">男女题库独立编写，题目情境与表达各不相同，只为更贴近你的真实体验。</p>
      <div class="gender-grid">
        <button class="g-card" data-gender="male">
          <span class="ring"></span>
          <svg class="g-icon" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="30" fill="#FFF0F6"/>
            <circle cx="32" cy="24" r="9.5" stroke="#F9629B" stroke-width="2.6"/>
            <path d="M15 52c2.4-9.4 8.8-14 17-14s14.6 4.6 17 14" stroke="#F9629B" stroke-width="2.6" stroke-linecap="round"/>
          </svg>
          <span class="g-name">男生</span>
          <span class="g-desc">使用男性情境题库</span>
        </button>
        <button class="g-card" data-gender="female">
          <span class="ring"></span>
          <svg class="g-icon" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="30" fill="#FFF0F6"/>
            <circle cx="32" cy="24" r="9.5" stroke="#F9629B" stroke-width="2.6"/>
            <path d="M15 52c2.4-9.4 8.8-14 17-14s14.6 4.6 17 14" stroke="#F9629B" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M38 12c3-4 8-3 8 1 0 3-4 6-8 9-4-3-8-6-8-9 0-4 5-5 8-1z" fill="#FF8AB5"/>
          </svg>
          <span class="g-name">女生</span>
          <span class="g-desc">使用女性情境题库</span>
        </button>
      </div>
      <p class="tip">结果类型与性别无关，仅影响题面表达方式</p>
    </div>
  </section>

  <!-- ============ 答题 ============ -->
  <section class="screen" id="sQuiz">
    <div class="quiz-shell">
      <header class="quiz-head">
        <div class="head-row">
          <span class="qidx"><b id="curNum">01</b> <i>/ 50</i></span>
          <span class="pct" id="pctText">0%</span>
        </div>
        <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      </header>
      <div class="q-card in" id="qCard">
        <div class="q-tag" id="qTag">亲密感受</div>
        <h3 class="q-text" id="qText"></h3>
        <div class="opts" id="opts"></div>
      </div>
      <p class="hint" id="quizHint">没有对错，只有像不像你。</p>
    </div>
  </section>

  <!-- ============ 加载 ============ -->
  <section class="screen" id="sLoading">
    <div class="loading-wrap">
      <div class="pulse-heart">❤</div>
      <p class="loading-text" id="loadingText">正在解析你的依恋图谱…</p>
      <div class="load-bar"><i id="loadFill"></i></div>
    </div>
  </section>

  <!-- ============ 结果 ============ -->
  <section class="screen" id="sResult">
    <div id="resultRoot"></div>
  </section>

</div>

<script>
/* =========================================================
   题库：男女各 30 题 × 2 维度，每次随机抽取 25+25 = 50 题
   a = 依恋焦虑维度   v = 依恋回避维度
   ========================================================= */
const BANK = {
  male: {
    a: [
      '她回消息慢了，我会不停点开对话框，猜她是不是不想理我。',
      '她和别的男生聊得开心，我心里会发紧，忍不住想打听。',
      '我常担心她并没有像我这样在意她。',
      '她一句语气冷一点的话，能让我胡思乱想一整天。',
      '我会反复翻看我们的聊天记录，确认她是不是在变冷淡。',
      '吵架后如果她不主动找我，我会整夜睡不着。',
      '我需要她经常说「我在乎你」，才觉得安心。',
      '她一忙起来少联系我，我就会怀疑自己是不是不重要了。',
      '我害怕被丢下，所以会格外用力地对她好。',
      '她说「我们先冷静一下」，我会立刻慌。',
      '为了留住她，我常常把真实想法咽回去。',
      '我总觉得这段关系里，我付出的比她多。',
      '她朋友圈没有提到我，我会有点失落。',
      '她出差或旅行，我会频繁发消息确认她的状态。',
      '我会担心她心里还装着前任。',
      '她拒绝我的邀约，我会觉得被否定的是我整个人。',
      '我希望随时知道她在哪、和谁在一起。',
      '一件小事就能让我联想到「她要离开我」。',
      '我常在她面前表现得比实际更需要陪伴。',
      '她说「我最近有点累」，我会紧张很久。',
      '我怕自己不够好，会被更优秀的人取代。',
      '她情绪不好时，我第一反应是「是不是我做错了」。',
      '我很难一个人待着，总想和她黏在一起。',
      '我会去看她点赞了谁、关注了谁。',
      '我很在意她朋友和家人对我的看法。',
      '她夸别人一句，我会记很久。',

/* =========================================================
   工具函数
   ========================================================= */
const $ = s => document.querySelector(s);
const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = (arr,n) => shuffle(arr).slice(0,n);
const mean = arr => arr.reduce((a,b)=>a+b,0)/arr.length;

/* =========================================================
   背景粒子
   ========================================================= */
(function particles(){
  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  let W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2),ps=[];
  function resize(){
    W = cv.width = innerWidth*dpr;
    H = cv.height = innerHeight*dpr;
    cv.style.width = innerWidth+'px';
    cv.style.height = innerHeight+'px';
  }
  function init(){
    ps = [];
    const n = Math.min(38, Math.floor(innerWidth/12));
    for(let i=0;i<n;i++){
      ps.push({
        x: Math.random()*W, y: Math.random()*H,
        r: (1+Math.random()*2.6)*dpr,
        vx: (Math.random()-.5)*0.18*dpr,
        vy: (-0.14-Math.random()*0.26)*dpr,
        a: 0.16+Math.random()*0.34,
        heart: Math.random()<0.32,
        rot: Math.random()*Math.PI*2,
        vr: (Math.random()-.5)*0.012
      });
    }
  }
  function heartPath(x,y,s,rot){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s,s);
    ctx.beginPath();
    ctx.moveTo(0,3.2);
    ctx.bezierCurveTo(-4.4,-0.8,-4.4,-5.4,0,-4.2);
    ctx.bezierCurveTo(4.4,-5.4,4.4,-0.8,0,3.2);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function loop(){
    ctx.clearRect(0,0,W,H);
    for(const p of ps){
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if(p.y < -30*dpr){ p.y = H+20*dpr; p.x = Math.random()*W; }
      if(p.x < -30*dpr) p.x = W+20*dpr;
      if(p.x > W+30*dpr) p.x = -20*dpr;
      ctx.fillStyle = `rgba(249,98,155,${p.a})`;
      if(p.heart) heartPath(p.x,p.y,p.r*0.72,p.rot);
      else { ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
    }
    requestAnimationFrame(loop);
  }
  resize(); init(); loop();
  addEventListener('resize', ()=>{ resize(); init(); });
})();

/* =========================================================
   爱心爆发特效
   ========================================================= */
function burst(x,y){
  for(let i=0;i<9;i++){
    const el = document.createElement('span');
    el.className = 'burst';
    el.textContent = '♥';
    el.style.left = x+'px';
    el.style.top = y+'px';
    el.style.fontSize = (9+Math.random()*11)+'px';
    const ang = Math.random()*Math.PI*2;
    const dist = 36+Math.random()*64;
    el.style.setProperty('--tx', Math.cos(ang)*dist+'px');
    el.style.setProperty('--ty', Math.sin(ang)*dist+'px');
    el.style.setProperty('--rot', (Math.random()*180-90)+'deg');
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 880);
  }
}

/* =========================================================
   屏幕切换
   ========================================================= */
function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('is-active'));
  const t = document.getElementById(id);
  t.classList.add('is-active');
  t.scrollTop = 0;
}

/* =========================================================
   状态
   ========================================================= */
const state = { gender:null, questions:[], index:0, answers:[], locked:false };

/* =========================================================
   流程
   ========================================================= */
$('#btnStart').addEventListener('click', ()=> go('sGender'));

document.querySelectorAll('.g-card').forEach(card=>{
  card.addEventListener('click', ()=>{
    state.gender = card.dataset.gender;
    startQuiz();
  });
});

function startQuiz(){
  const bank = BANK[state.gender];
  const aQ = pick(bank.a, 25).map(t=>({dim:'a', text:t}));
  const vQ = pick(bank.v, 25).map(t=>({dim:'v', text:t}));
  state.questions = shuffle([...aQ, ...vQ]);
  state.index = 0;
  state.answers = [];
  state.locked = false;
  go('sQuiz');
  renderQuestion(false);
  updateProgress();
  setHint('没有对错，只有像不像你。');
}

function setHint(txt){
  const h = $('#quizHint');
  h.textContent = txt;
  h.classList.remove('pop');
  void h.offsetWidth;
  h.classList.add('pop');
}

function updateProgress(){
  const p = Math.round(state.index / state.questions.length * 100);
  $('#barFill').style.width = p + '%';
  $('#pctText').textContent = p + '%';
  $('#curNum').textContent = String(Math.min(state.index+1, state.questions.length)).padStart(2,'0');
}

function renderQuestion(animate){
  const card = $('#qCard');
  const q = state.questions[state.index];

  const fill = () => {
    $('#qText').textContent = q.text;
    $('#qTag').textContent = q.dim === 'a' ? '亲密感受' : '亲密距离';
    const box = $('#opts');
    box.innerHTML = '';
    OPTIONS.forEach((label,i)=>{
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = `<span class="k">${'ABCDE'[i]}</span><span>${label}</span>`;
      b.addEventListener('click', ev => choose(b, i+1, ev));
      box.appendChild(b);
    });
    updateProgress();
  };

  if(animate){
    card.classList.remove('in');
    card.classList.add('out');
    setTimeout(()=>{
      fill();
      card.classList.remove('out');
      card.classList.add('in');
    }, 210);
  } else {
    fill();
    card.classList.remove('out');
    card.classList.add('in');
  }
}

function choose(el, val, ev){
  if(state.locked) return;
  state.locked = true;

  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('picked'));
  el.classList.add('picked');

  const r = el.getBoundingClientRect();
  burst(r.left + r.width*0.5, r.top + r.height*0.5);

  const q = state.questions[state.index];
  state.answers.push({ dim:q.dim, val });

  state.index++;
  updateProgress();

  const done = state.index;
  if(done === 10) setHint('已经走过 1/5，你的轮廓开始清晰了。');
  else if(done === 25) setHint('过半了，继续保持第一直觉。');
  else if(done === 40) setHint('快到终点了，最后 10 题。');

  setTimeout(()=>{
    if(state.index >= state.questions.length){
      finish();
    } else {
      renderQuestion(true);
      state.locked = false;
    }
  }, 330);
}

/* =========================================================
   结算
   ========================================================= */
function finish(){
  go('sLoading');
  const texts = ['正在解析你的依恋图谱…','比对四种依恋原型…','生成你的专属恋爱建议…'];
  let i = 0;
  $('#loadingText').textContent = texts[0];
  $('#loadFill').style.width = '0%';

  setTimeout(()=>{ $('#loadFill').style.width='38%'; }, 120);
  const t1 = setInterval(()=>{
    i++;
    if(i < texts.length) $('#loadingText').textContent = texts[i];
  }, 800);
  setTimeout(()=>{ $('#loadFill').style.width='100%'; }, 1500);

  setTimeout(()=>{
    clearInterval(t1);
    showResult();
  }, 2400);
}

function showResult(){
  const aVals = state.answers.filter(x=>x.dim==='a').map(x=>x.val);
  const vVals = state.answers.filter(x=>x.dim==='v').map(x=>x.val);
  const aScore = Math.round((mean(aVals)-1)/4*100);
  const vScore = Math.round((mean(vVals)-1)/4*100);

  let key;
  if(aScore >= 50 && vScore >= 50) key = 'fearful';
  else if(aScore >= 50) key = 'anxious';
  else if(vScore >= 50) key = 'avoidant';
  else key = 'secure';

  const T = TYPES[key];

  const bandText = (pct, label) => {
    if(pct < 30) return `你的${label}偏低，在关系里相对放松。`;
    if(pct < 50) return `你的${label}略低于平均线，整体可控。`;
    if(pct < 70) return `你的${label}偏高，是关系中需要被照顾的部分。`;
    return `你的${label}很高，这可能是你最容易被触发的地方。`;
  };

  const root = $('#resultRoot');
  root.innerHTML = `
    <div class="res-hero">
      <div class="res-badge">你 的 依 恋 类 型</div>
      <div class="avatar-box">${avatarSVG(key)}</div>
      <h2 class="res-name grad">${T.name}</h2>
      <p class="res-en">${T.en} · ${T.alias}</p>
      <p class="res-tagline">${T.tagline}</p>
    </div>

    <div class="res-card">
      <h3>你的依恋分数</h3>
      <div class="scores">
        <div class="score-row">
          <div class="score-head"><span>依恋焦虑 · 怕被抛弃</span><b>${aScore}%</b></div>
          <div class="score-bar"><i data-w="${aScore}"></i></div>
        </div>
        <div class="score-row">
          <div class="score-head"><span>依恋回避 · 怕太亲密</span><b>${vScore}%</b></div>
          <div class="score-bar"><i data-w="${vScore}"></i></div>
        </div>
      </div>
      <p class="score-note">${bandText(aScore,'焦虑维度')}${bandText(vScore,'回避维度')}两个维度共同决定你的类型：低焦虑低回避为安全型，高焦虑低回避为焦虑型，低焦虑高回避为回避型，双高为混乱型。</p>
    </div>

    <div class="res-card">
      <h3>关于你的亲密模式</h3>
      ${T.analysis.map(p=>`<p>${p}</p>`).join('')}
    </div>

    <div class="res-card">
      <h3>你可能会有这些瞬间</h3>
      <ul>${T.traits.map(t=>`<li>${t}</li>`).join('')}</ul>
    </div>

    <div class="res-card accent">
      <h3>给你的 5 条恋爱建议</h3>
      <ol>${T.advice.map(t=>`<li>${t}</li>`).join('')}</ol>
    </div>

    <div class="res-card">
      <h3>和谁在一起会更舒服</h3>
      <p>${T.partner}</p>
    </div>

    <div class="res-card">
      <h3>你的成长课题</h3>
      <p>${T.grow}</p>
    </div>

    <div class="res-foot">
      <button class="btn btn-ghost" id="btnRestart">重新测一次</button>
      <p class="tip">截图保存 · 随时回看你的依恋图谱</p>
      <p class="disclaimer">本测评基于成人依恋理论（Bowlby / Hazan & Shaver）编制，结果用于自我觉察与关系理解，不构成临床心理诊断。</p>
    </div>
  `;

  go('sResult');

  // 分数条动画
  setTimeout(()=>{
    root.querySelectorAll('.score-bar i').forEach(el=>{
      el.style.width = el.dataset.w + '%';
    });
  }, 380);

  // 卡片依次浮现
  const cards = root.querySelectorAll('.res-card');
  cards.forEach((c,i)=>{
    setTimeout(()=>c.classList.add('show'), 260 + i*130);
  });

  $('#btnRestart').addEventListener('click', ()=>{
    state.locked = false;
    go('sGender');
  });
}
